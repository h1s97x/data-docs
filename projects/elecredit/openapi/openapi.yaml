          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/JudicialRequest" },
              "example": { "entityName": "恒大地产集团有限公司", "type": "ktgg", "pageNo": "1", "range": "20" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ApiResponseJudicial" },
                "example": {
                  "code": "000",
                  "msg": "查询成功",
                  "orderNo": "a14eb808e0c245f4b15c1123b0e2265b",
                  "resultCode": "000",
                  "resultData": {
                    "P0030089Status": "1",
                    "P0030089Data": {
                      "detailListMeta": {
                        "totalCount": "16723",
                        "totalPage": "837",
                        "pageNo": "1",
                        "range": "20",
                        "actualNo": 20,
                        "ktggCount": "16723",
                        "ktggPageNum": "837",
                        "shixinCount": "598",
                        "zxggCount": "9731",
                        "cpwsCount": "2776",
                        "fyggCount": "2420",
                        "bgtCount": "3607"
                      },
                      "detailList": [{ "annoType": "", "title": "开庭公告标题", "court": "某法院" }]
                    }
                  }
