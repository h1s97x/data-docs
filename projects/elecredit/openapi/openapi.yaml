      }
    },

    "/litigation/xgbzxrPeople/wh": {
      "post": {
        "tags": ["风险司法"],
        "summary": "D14 限制高消费人员查询",
        "description": "按姓名 + 身份证号查询某人是否为限制高消费人员（限消令）。身份证号需完整 18 位，响应中脱敏展示。",
        "operationId": "xgbzxr",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/XgbzxrRequest" },
              "example": { "persName": "许家印", "idNo": "110101195804261234" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ApiResponseXgbzxr" }
              }
            }
          }
        }
      }
    },

    "/saic/equityPenetration": {
      "post": {
        "tags": ["企业图谱"],
        "summary": "F09 企业股权图谱",
        "description": "企业全貌图谱：向下穿透对外投资 + 向上穿透股东链，递归展开。默认 3 层、5% 持股阈值。注意端点默认 60 秒超时。",
        "operationId": "equityGraph",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/GraphRequest" },
              "example": { "entInfo": "贵州茅台", "level": "3", "down": true, "up": true }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ApiResponseGraph" }
              }
            }
          }
        }
      }
    },

    "/enterprise/biddingYPageWh": {
      "post": {
        "tags": ["企业图谱"],
        "summary": "B04 招投标信息",
        "description": "返回企业的招标 / 中标记录列表。⚠️ 参数名必须是 entInfo（传 entName 会返回 400）。",
        "operationId": "bidding",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/BiddingRequest" },
              "example": { "entInfo": "贵州茅台", "pageNo": "1", "range": "10" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ApiResponseBidding" },
                "example": {
                  "ok": true,
                  "bizCode": "001",
                  "data": {
                    "P0010034Status": "1",
                    "P0010034Data": { "resultList": [] }
                  },
                  "orderNo": "a14eb808e0c245f4b15c1123b0e2265b"
                }
              }
            }
          }
        }
      }
    },

    "/saic/SaicinvWh": {
      "post": {
        "tags": ["企业图谱"],
        "summary": "P0020019 实控人（法人 / 股东穿透）",
        "description": "返回企业实际控制人及其穿透链路。⚠️ 路径大小写敏感（小写 w 的 SaicinvWh），参数名必须是 entInfo（传 entName 会返回 400）。",
        "operationId": "actualController",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/ActualControllerRequest" },
              "example": { "entInfo": "国家电网有限公司" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ApiResponseActualController" }
              }
            }
          }
        }
      }
    }
  },

  "components": {

    "securitySchemes": {
      "ElecreditAppId": {
        "type": "apiKey",
        "in": "header",
        "name": "app-id",
        "description": "App ID。从 https://api.elecredit.com/admin 获取，与 App Key 配对使用。"
      },
      "ElecreditAppKey": {
        "type": "apiKey",
        "in": "header",
        "name": "app-key",
        "description": "App Key（密钥，用于计算签名，**不会作为 Header 发送**）。\n\n签名算法：\n```\nsn       = uuid.hex()                    # 32 位随机\nts       = str(int(time.time() * 1000)) # 毫秒时间戳\nbody     = json.dumps(obj, ensure_ascii=False, separators=(',', ':'))\nsignStr  = sn + ts + body + appKey\nsignature= MD5(signStr).hex()           # 小写 32 位\n```\n\n最终发送 5 个 Header：\n- `app-id`:        <App ID>\n- `timestamp`:     <毫秒时间戳>\n- `request-sn`:    <32 位 UUID>\n- `signature`:     <MD5 小写 hex>\n- `sign-type`:     MD5"
      }
    },

    "headers": {
      "AppId": {
        "description": "App ID（从 https://api.elecredit.com/admin 获取）",
        "schema": { "type": "string" },
        "required": true
      },
      "Timestamp": {
        "description": "当前毫秒时间戳（UTC+8）",
        "schema": { "type": "string" },
        "required": true
      },
      "RequestSn": {
        "description": "32 位随机 UUID（用于签名）",
        "schema": { "type": "string" },
        "required": true
      },
      "Signature": {
        "description": "MD5(sn + timestamp + body + appKey).hex() 小写 32 位",
        "schema": { "type": "string" },
        "required": true
      },
      "SignType": {
        "description": "签名算法类型",
        "schema": { "type": "string", "enum": ["MD5", "SHA256"], "default": "MD5" },
        "required": true
      }
    },

    "schemas": {

      "ApiEnvelope": {
        "type": "object",
        "description": "通用响应信封",
        "properties": {
          "code": {
            "type": "string",
            "description": "业务码：`000`/空=成功, `001`=查询成功无结果, SYSxxx=系统错误"
          },
          "msg": { "type": "string", "description": "响应消息" },
          "orderNo": { "type": "string", "description": "请求流水号（可用于对账）" },
          "resultCode": { "type": "string", "description": "结果码" },
          "resultData": { "description": "业务数据（类型因端点而异）" }
        }
      },

      "ErrorResponse": {
        "type": "object",
        "description": "错误响应",
        "properties": {
          "code": { "type": "string", "enum": ["SYS001", "SYS002", "SYS003", "SYS004", "SYS005", "SYS006", "SYS008", "SYS044"] },
          "msg": { "type": "string" },
          "orderNo": { "type": "string" }
        },
        "allOf": [
          {
            "description": "错误码说明：\n- SYS001: 签名校验失败（检查 appKey、中文不转义、body 紧凑 JSON）\n- SYS002: 请求过期（同步本机时钟）\n- SYS003: 应用 ID 不存在\n- SYS004: 签名算法不支持\n- SYS005: 余额不足（签名已通过，提示充值）\n- SYS006: IP 受限\n- SYS008: 频率限制\n- SYS044: 资源不存在（检查路径大小写）"
          }
        ]
      },

      "_Pagination": {
        "type": "object",
        "properties": {
          "pageNo": { "type": "string", "description": "页码，从 1 开始" },
          "range": { "type": "string", "description": "每页数量（司法端点上限 20）" }
        }
      },

      "FuzzyRequest": {
        "type": "object",
        "required": ["entName"],
        "properties": {
          "entName": { "type": "string", "description": "企业名称关键字，建议 2 个字符以上" },
          "type": { "type": "string", "description": "0=工商主体, 1=非工商主体, 2=全部（默认）", "enum": ["0", "1", "2"] },
          "regionId": { "type": "string", "description": "行政区划代码，逗号分隔多个" },
          "pageNo": { "type": "string", "description": "页码，从 1 开始" },
          "range": { "type": "string", "description": "每页数量" }
        }
      },

      "FuzzyEnterprise": {
        "type": "object",
        "properties": {
          "creditCode": { "type": "string", "description": "统一社会信用代码" },
          "regNo": { "type": "string", "description": "工商注册号" },
          "entName": { "type": "string", "description": "企业全称" },
          "entType": { "type": "string", "description": "企业类型" },
          "openStatus": { "type": "string", "description": "经营状态" },
          "regCap": { "type": "string", "description": "注册资本" },
          "estiblishTime": { "type": "string", "description": "成立时间" },
          "regCity": { "type": "string", "description": "所在行政区" }
        }
      },

      "ApiResponseFuzzy": {
        "allOf": [
          { "$ref": "#/components/schemas/ApiEnvelope" },
          {
            "type": "object",
            "properties": {
              "resultData": {
                "type": "array",
                "items": { "$ref": "#/components/schemas/FuzzyEnterprise" }
              }
            }
          }
        ]
      },

      "DeepRequest": {
        "type": "object",
        "description": "四个标识字段至少填一个，可混用",
        "properties": {
          "entName": { "type": "string", "description": "企业全称" },
          "creditCode": { "type": "string", "description": "统一社会信用代码（18 位）" },
          "regNo": { "type": "string", "description": "工商注册号（15 位）" },
          "orgCode": { "type": "string", "description": "组织机构代码（9 位）" }
        }
      },

      "DeepEnterpriseDetail": {
        "type": "object",
        "properties": {
          "creditCode": { "type": "string", "description": "统一社会信用代码" },
          "entName": { "type": "string", "description": "企业全称" },
          "openStatus": { "type": "string", "description": "经营状态" },
          "entType": { "type": "string", "description": "企业类型" },
          "regCap": { "type": "string", "description": "注册资本" },
          "estiblishTime": { "type": "string", "description": "成立时间" },
          "regAddress": { "type": "string", "description": "注册地址" },
          "annualReportList": { "type": "array", "description": "年报信息列表", "items": { "type": "object" } },
          "equityPledgeList": { "type": "array", "description": "股权出质登记", "items": { "type": "object" } },
          "judicialAssistanceList": { "type": "array", "description": "司法协助信息", "items": { "type": "object" } },
          "seriousIllegalList": { "type": "array", "description": "严重违法失信企业", "items": { "type": "object" } }
        }
      },

      "ApiResponseDeep": {
        "allOf": [
          { "$ref": "#/components/schemas/ApiEnvelope" },
          {
            "type": "object",
            "properties": {
              "resultData": { "$ref": "#/components/schemas/DeepEnterpriseDetail" }
            }
          }
        ]
      },

      "ScaleRequest": {
        "type": "object",
        "required": ["entInfo"],
        "properties": {
          "entInfo": { "type": "string", "description": "信用代码、注册号或企业名称 任一" }
        }
      },

      "ScaleDetail": {
        "type": "object",
        "description": "判定依据",
        "properties": {
          "employeeCount": { "type": "string", "description": "从业人员数" },
          "revenue": { "type": "string", "description": "营业收入" },
          "totalAssets": { "type": "string", "description": "资产总额" }
        }
      },

      "ScaleResult": {
        "type": "object",
        "properties": {
          "entName": { "type": "string", "description": "匹配到的企业名称" },
          "scale": { "type": "string", "description": "划型结果", "enum": ["大型", "中型", "小型", "微型"] },
          "scaleDetail": { "$ref": "#/components/schemas/ScaleDetail" }
        }
      },

      "ApiResponseScale": {
        "allOf": [
          { "$ref": "#/components/schemas/ApiEnvelope" },
          {
            "type": "object",
            "properties": {
              "resultData": { "$ref": "#/components/schemas/ScaleResult" }
            }
          }
        ]
      },

      "TaxRequest": {
        "type": "object",
        "required": ["entityName"],
        "properties": {
          "entityName": { "type": "string", "description": "企业名称" },
          "type": {
            "type": "string",
            "description": "税务类型，省略时返回全部",
            "enum": ["satpartyXin", "satpartyQs", "satpartyChufa", "satpartyFzc"]
          },
          "pageNo": { "type": "string", "description": "页码，从 1 开始" },
          "range": { "type": "string", "description": "每页数量" }
        }
      },

      "TaxResult": {
        "type": "object",
