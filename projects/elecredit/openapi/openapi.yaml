{
  "openapi": "3.1.0",
  "info": {
    "title": "Elecredit — 企业风控数据 API",
    "description": "企业风控统一入口。覆盖 10 个 REST 端点：工商模糊/深度查询、大中小微划型、税务信用、行政处罚、司法（12 种 type）、限消人员、企业股权图谱、招投标、实控人。\n\n**签名算法**：`MD5(requestSn + timestamp_ms + bodyCompactJson + appKey).hex()`\n\n**请求约定**：全部 POST + JSON body，签名放 HTTP Header（非 body），body 用紧凑 JSON（中文不转义）。",
    "version": "1.0.0",
    "contact": {
      "name": "Elecredit",
      "url": "https://api.elecredit.com/admin"
    }
  },
  "servers": [
    {
      "url": "https://api.elecredit.com",
      "description": "生产网关"
    }
  ],
  "tags": [
    { "name": "企业工商", "description": "工商模糊查询、深度查询、大中小微划型" },
    { "name": "风险司法", "description": "司法查询、限消人员" },
    { "name": "税务行政处罚", "description": "税务信用、行政处罚" },
    { "name": "企业图谱", "description": "股权图谱、招投标、实控人" }
  ],
  "security": [
    { "ElecreditAppId": [], "ElecreditAppKey": [] }
  ],
  "paths": {

    "/mohu/wh": {
      "post": {
        "tags": ["企业工商"],
        "summary": "A07 企业工商模糊查询",
        "description": "按企业名称或部分关键字模糊搜索，返回匹配企业列表。支持分页。",
        "operationId": "fuzzyEnterprise",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/FuzzyRequest" },
              "example": { "entName": "贵州茅台", "type": "2", "pageNo": "1", "range": "10" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ApiResponseFuzzy" },
                "example": {
                  "code": "000",
                  "msg": "查询成功",
                  "orderNo": "a14eb808e0c245f4b15c1123b0e2265b",
                  "resultCode": "000",
                  "resultData": [
                    {
                      "creditCode": "91520300MA6DJXXXX",
                      "regNo": "520300000XXXXXX",
                      "entName": "贵州茅台酒股份有限公司",
                      "entType": "股份有限公司",
                      "openStatus": "存续",
                      "regCap": "125619.78万元",
                      "estiblishTime": "2001-08-20",
                      "regCity": "遵义市"
                    }
                  ]
                }
              }
            }
          }
        }
      }
    },

    "/saic/enterprise/deep/wh": {
      "post": {
        "tags": ["企业工商"],
        "summary": "A03 企业工商深度查询",
        "description": "企业工商详情 + 10+ 年报子列表 + 股权出质 + 司法协助 + 严重违法。四个标识字段至少填一个，可混用。",
        "operationId": "deepEnterprise",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/DeepRequest" },
              "example": { "entName": "贵州茅台酒股份有限公司" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功（大结果）",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ApiResponseDeep" }
              }
            }
          }
        }
      }
    },

    "/enterprise/companyLevel/wh": {
      "post": {
        "tags": ["企业工商"],
        "summary": "A04 企业大中小微划型",
        "description": "返回企业划型结果（大型/中型/小型/微型）。基于从业人员数、营业收入、资产总额三个指标综合判定。",
        "operationId": "scaleEnterprise",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/ScaleRequest" },
              "example": { "entInfo": "贵州茅台" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ApiResponseScale" },
                "example": {
                  "code": "000",
                  "msg": "查询成功",
                  "orderNo": "a14eb808e0c245f4b15c1123b0e2265b",
                  "resultCode": "000",
                  "resultData": {
                    "entName": "贵州茅台酒股份有限公司",
                    "scale": "大型",
                    "scaleDetail": {
                      "employeeCount": "4000+",
                      "revenue": "1500亿",
                      "totalAssets": "2500亿"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },

    "/enterprise/taxInfo": {
      "post": {
        "tags": ["税务行政处罚"],
        "summary": "B06 企业税务信用查询",
        "description": "企业税务 4 类信息：纳税信用等级、欠税公告、涉税处罚、非正常户公告。可按 type 过滤。",
        "operationId": "taxInfo",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/TaxRequest" },
              "example": { "entityName": "贵州茅台", "type": "satpartyXin" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ApiResponseTax" }
              }
            }
          }
        }
      }
    },

    "/enterprise/adminPunishment": {
      "post": {
        "tags": ["税务行政处罚"],
        "summary": "D07 行政处罚",
        "description": "多渠道行政处罚：工商、证监会、食药监、银监会、海关、税务、安监等。支持按类型和日期范围过滤。",
        "operationId": "adminPunishment",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/AdminPunishmentRequest" },
              "example": {
                "entInfo": "贵州茅台",
                "type": "buss",
                "startDate": "2023-01-01",
                "endDate": "2024-12-31"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ApiResponseAdminPunishment" }
              }
            }
          }
        }
      }
    },

    "/risk/sifaInfo/wh": {
      "post": {
        "tags": ["风险司法"],
        "summary": "D11 企业司法模糊查询",
        "description": "按企业名称聚合返回该企业的司法类数据（12 种 type），并给出各类型的分页元数据 detailListMeta。⚠️ 字段名是 entityName（不是 entName/entInfo），type 单值不支持多选，range 上限 20。",
        "operationId": "judicialFuzzy",
